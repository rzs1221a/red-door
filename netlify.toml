[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Keeps the preview out of search results. Delete the X-Robots-Tag line at launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The services page used to live at /rental-owners/.
[[redirects]]
  from = "/rental-owners/*"
  to = "/services/"
  status = 301
